name: portfolio-stack

services:
  frontend:
    container_name: portfolio-frontend
    build:
      context: ./frontend/Docker
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true # Ensures instant hot-reload inside WSL environments
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    networks:
      - dev-network

  # 2. BACKEND: Laravel API Engine
  backend:
    container_name: portfolio-backend
    build:
      context: ./backend/Docker
      dockerfile: Dockerfile
      args:
        WWWUSER: '${WWWUSER}'
        WWWGROUP: '${WWWGROUP}'
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    networks:
      - dev-network

  # Local S3 is the shared SeaweedFS container on dev-stack_dev-network.
  # It is started from ~/dev-containers/seaweedfs, not from this stack.
  # Other containers reach it at http://seaweedfs:8333. The host uses http://localhost:8333.
  # seaweedfs:
  #   image: chrislusf/seaweedfs
  #   container_name: seaweedfs
  #   command: mini -dir=/data
  #   environment:
  #     AWS_ACCESS_KEY_ID: admin
  #     AWS_SECRET_ACCESS_KEY: secret
  #     S3_BUCKET: local
  #   ports:
  #     - "8333:8333"
  #   volumes:
  #     - seaweedfs_data:/data
  #   networks:
  #     - dev-network

networks:
  dev-network:
    name: dev-stack_dev-network # Tells Docker the exact real name of your cache network
    external: true
