[unix_http_server]
file=/var/run/supervisor.sock
chmod=0777

[program:laravel]
command=php /var/www/html/artisan serve --host=0.0.0.0 --port=80
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/laravel.log
stderr_logfile=/var/log/supervisor/laravel.err.log

[program:queue-default]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
numprocs=1
stdout_logfile=/var/log/supervisor/queue-default.log
stderr_logfile=/var/log/supervisor/queue-default.err.log

[program:queue-emails]
command=php /var/www/html/artisan queue:work --queue=emails --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
numprocs=1
stdout_logfile=/var/log/supervisor/queue-emails.log
stderr_logfile=/var/log/supervisor/queue-emails.err.log

[program:queue-cache]
command=php /var/www/html/artisan queue:work --queue=cache --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
numprocs=1
stdout_logfile=/var/log/supervisor/queue-cache.log
stderr_logfile=/var/log/supervisor/queue-cache.err.log

[program:queue-reports]
command=php /var/www/html/artisan queue:work --queue=reports --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
numprocs=1
stdout_logfile=/var/log/supervisor/queue-reports.log
stderr_logfile=/var/log/supervisor/queue-reports.err.log

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
